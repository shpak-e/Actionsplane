<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ActionsPlane — the fleet control plane for GitHub Actions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0C0E"/>
      <stop offset="1" stop-color="#131720"/>
    </linearGradient>
    <radialGradient id="ember" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 300) rotate(-135) scale(520)">
      <stop offset="0" stop-color="#F6A623" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#F6A623" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#F6A623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6A623"/>
      <stop offset="1" stop-color="#F6A623" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- ground -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#ember)"/>

  <!-- decorative "run lanes" — echoes the live runs dashboard, kept faint so it never competes -->
  <g opacity="0.9" transform="translate(792 92)">
    <g font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#767D89">
      <!-- lane: passing -->
      <rect x="0" y="6"  width="360" height="10" rx="5" fill="#1B1E23"/>
      <rect x="0" y="6"  width="360" height="10" rx="5" fill="#2FD3A0" opacity="0.55"/>
      <circle cx="372" cy="11" r="5" fill="#2FD3A0"/>
      <!-- lane: passing -->
      <rect x="0" y="42" width="300" height="10" rx="5" fill="#1B1E23"/>
      <rect x="0" y="42" width="300" height="10" rx="5" fill="#2FD3A0" opacity="0.55"/>
      <circle cx="312" cy="47" r="5" fill="#2FD3A0"/>
      <!-- lane: running (ember) -->
      <rect x="0" y="78" width="360" height="10" rx="5" fill="#1B1E23"/>
      <rect x="0" y="78" width="228" height="10" rx="5" fill="#F6A623" opacity="0.85"/>
      <circle cx="372" cy="83" r="5" fill="#F6A623"/>
      <!-- lane: failed -->
      <rect x="0" y="114" width="330" height="10" rx="5" fill="#1B1E23"/>
      <rect x="0" y="114" width="150" height="10" rx="5" fill="#FB6B5B" opacity="0.7"/>
      <circle cx="342" cy="119" r="5" fill="#FB6B5B"/>
      <!-- lane: queued -->
      <rect x="0" y="150" width="360" height="10" rx="5" fill="#1B1E23"/>
      <rect x="0" y="150" width="96" height="10" rx="5" fill="#5BA8FF" opacity="0.6"/>
      <circle cx="372" cy="155" r="5" fill="#5BA8FF"/>
    </g>
  </g>

  <!-- brand mark: the fast-forward run-fleet triangles (lead one in ember) -->
  <g transform="translate(80 116) scale(3.1)">
    <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" fill="#15171B" stroke="#353B44" stroke-width="1.4"/>
    <path d="M8 9.5 L8 22.5 L14 16 Z" fill="#4D545E"/>
    <path d="M13 9.5 L13 22.5 L19 16 Z" fill="#B2B8C2"/>
    <path d="M18 9.5 L18 22.5 L24 16 Z" fill="#F6A623"/>
  </g>

  <!-- wordmark -->
  <text x="212" y="182" font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1">
    <tspan fill="#F3F5F8">Actions</tspan><tspan fill="#F6A623">Plane</tspan>
  </text>
  <rect x="214" y="202" width="132" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- tagline -->
  <text x="214" y="240" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#B2B8C2">The fleet control plane for GitHub Actions.</text>

  <!-- eyebrow -->
  <text x="215" y="278" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="13" letter-spacing="4.5" fill="#767D89">OBSERVE · AUDIT · FIX — EVERY FIX A REVIEWABLE PR</text>
</svg>
